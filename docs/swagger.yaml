basePath: /
definitions:
  models.Item:
    type: object
host: localhost:8080
info:
  contact: {}
  description: 這是一個用 Go 寫的高併發拍賣網站 API 系統，具備 JWT 防護與資料庫悲觀鎖。
  title: Mercari Clone API
  version: "1.0"
paths:
  /items:
    get:
      consumes:
      - application/json
      description: 支援 limit 與 offset 分頁功能，取得最新的拍賣商品
      parameters:
      - description: 限制回傳筆數 (預設 10)
        in: query
        name: limit
        type: integer
      - description: 跳過幾筆資料 (預設 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 取得商品列表
      tags:
      - items
    post:
      consumes:
      - application/json
      description: 建立一個新的商品並存入資料庫
      parameters:
      - description: 商品資料 (填寫 name 和 price 即可)
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
      security:
      - BearerAuth: []
      summary: 新增拍賣商品
      tags:
      - items
  /login:
    post:
      consumes:
      - application/json
      description: 隨便輸入帳密來換取 JWT Token
      parameters:
      - description: 請輸入帳號與密碼，格式如右
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 登入系統取得手環
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
